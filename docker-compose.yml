
services:
  orv-api:
    build:
      context: ./ORV
    ports:
      - "8001:8001"
    env_file:
      - ./ORV/.env
    volumes:
      - ./ORV:/app

  rai-backend:
    build:
      context: ./RAI/backend
    ports:
      - "8000:8000"
    env_file:
      - ./RAI/backend/.env
    volumes:
      - ./RAI/backend:/app
    depends_on:
      - orv-api

  rai-web:
    build:
      context: ./RAI/frontend/web
    ports:
      - "5173:5173"
    volumes:
      - ./RAI/frontend/web:/app
      - /app/node_modules # Prevents host node_modules from overwriting container node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true # Helps Vite hot-reload work smoothly on Windows/Linux dual boot
    depends_on:
      - rai-backend